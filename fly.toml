app = 'vira-los'
primary_region = 'ams'

[build]

[env]
  PORT = "8080"
  NODE_ENV = "production"
  SERVER_URL = "https://vira-los.fly.dev"
  # Uploads (clipes crus + reels renderizados) vão pro volume persistente
  # (/app/data é o mount). Sem isso, cada deploy apaga os vídeos enviados.
  UPLOADS_DIR = "/app/data/uploads"

[http_service]
  internal_port = 8080
  force_https = true
  # Máquina dorme por inatividade (economia). É ACORDADA por HTTP — a rotina
  # diária roda via cron externo (GitHub Actions) que bate em /api/daily-content
  # e fica fazendo polling até concluir, mantendo a máquina viva durante a geração.
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  max_machines_running = 1
  processes = ['app']

[[mounts]]
  source = 'vira_los_data'
  destination = '/app/data'
  initial_size = '3gb'

[[vm]]
  # EMERGÊNCIA (2026-08-10): o host do Fly que segura o volume ficou SEM
  # CAPACIDADE pra recriar a máquina de 2GB/2CPU — o app ficou com ZERO máquina
  # e caiu ("insufficient resources to create new machine with existing volume").
  # Reduzido pra 1GB/1CPU pra CABER no host e voltar ao ar (os dados no volume
  # estão intactos). Assim que a região liberar capacidade, escalar de volta:
  #   fly scale vm shared-cpu-2x --memory 2048 -a vira-los
  # OBS: a 1GB o render pesado (ffmpeg + Chromium juntos) pode dar OOM — o app,
  # a UI e os dados funcionam; a geração/render pode ficar instável até voltar pra 2GB.
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
