app = 'vira-los'
primary_region = 'ams'

[build]

[env]
  PORT = "8080"
  NODE_ENV = "production"
  SERVER_URL = "https://vira-los.fly.dev"
  # Uploads (clipes crus + reels renderizados) vão pro volume persistente
  # (/app/data é o mount). Sem isso, cada deploy apaga os vídeos enviados.
  UPLOADS_DIR = "/app/data/uploads"

[http_service]
  internal_port = 8080
  force_https = true
  # Máquina dorme por inatividade (economia). É ACORDADA por HTTP — a rotina
  # diária roda via cron externo (GitHub Actions) que bate em /api/daily-content
  # e fica fazendo polling até concluir, mantendo a máquina viva durante a geração.
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  max_machines_running = 1
  processes = ['app']

[[mounts]]
  source = 'vira_los_data'
  destination = '/app/data'
  initial_size = '3gb'

[[vm]]
  # Render de vídeo (ffmpeg libx264 + Chromium do overlay) é pesado. Com 1GB a
  # máquina estourava memória (OOM) e reiniciava no meio do lote. 2GB dá folga
  # pros dois rodarem juntos e 2 vCPUs deixam o libx264 encodar em 2 threads —
  # corta o tempo de render quase pela metade. Como a máquina dorme por
  # inatividade (scale-to-zero), só paga enquanto está renderizando.
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
