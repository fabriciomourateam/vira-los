name: Debug — capturar API do mLabs (descoberta)

# Dispara a rota de diagnóstico que captura as chamadas de API que o site do mLabs
# faz (pra descobrir os endpoints da API nova e ligar o story pelo formato novo).
# Só manual (workflow_dispatch). Remover junto com a rota depois da descoberta.

on:
  workflow_dispatch: {}

jobs:
  capturar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /api/mlabs/capture-api e imprimir
        env:
          BASE: https://vira-los.fly.dev
        run: |
          set -e
          echo "Acordando a máquina e capturando (pode levar ~60s)..."
          resp=$(curl -sS -m 180 "$BASE/api/mlabs/capture-api" || echo '{}')
          echo "count: $(echo "$resp" | jq -r '.count // "erro"')"
          echo "--- requests (method host path | status | v=accept-version auth=? profile | body | resp) ---"
          echo "$resp" | jq -r '.requests[]? | "\(.method) \(.host)\(.path) | \(.status) | v=\(.authVersion) auth=\(.hasAuth) prof=\(.currentProfile) | body=\(.body // "" | .[0:200]) | resp=\(.resp // "" | .[0:220])"' || echo "$resp" | head -c 2000
