name: Debug — capturar API do mLabs (descoberta)

# Descoberta pra ligar o story pelo formato certo. Com input "id", puxa o JSON cru
# de um agendamento (pra ver como um STORY real é representado). Sem id, captura as
# chamadas que o site do mLabs faz. Só manual. Remover depois da descoberta.

on:
  workflow_dispatch:
    inputs:
      id:
        description: "scheduleId do mLabs (ex.: 366177273 = story de teste). Vazio = captura geral."
        required: false
        default: ""

jobs:
  capturar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /api/mlabs/capture-api e imprimir
        env:
          BASE: https://vira-los.fly.dev
          ID: ${{ github.event.inputs.id }}
        run: |
          set -e
          if [ -n "$ID" ]; then
            echo "Puxando JSON cru do agendamento $ID..."
            resp=$(curl -sS -m 180 "$BASE/api/mlabs/capture-api?id=$ID" || echo '{}')
            echo "$resp" | jq '.' || echo "$resp"
          else
            echo "Capturando chamadas do site (pode levar ~60s)..."
            resp=$(curl -sS -m 180 "$BASE/api/mlabs/capture-api" || echo '{}')
            echo "count: $(echo "$resp" | jq -r '.count // "erro"')"
            echo "$resp" | jq -r '.requests[]? | "\(.method) \(.host)\(.path) | \(.status) | v=\(.authVersion) auth=\(.hasAuth) prof=\(.currentProfile) | body=\(.body // "" | .[0:200]) | resp=\(.resp // "" | .[0:220])"' || echo "$resp" | head -c 2000
          fi
