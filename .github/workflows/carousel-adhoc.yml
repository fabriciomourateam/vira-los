name: Carrossel — gerar sob demanda (roteiro fixo)

# Manual: gera um carrossel FMTeam a partir de um roteiro fixo (tema do MÉTODO/
# acompanhamento, sem substância), tira screenshots e SALVA como rascunho na aba
# Carrossel do app. Usado pra criar a versão anunciável adaptada ao negócio.

on:
  workflow_dispatch: {}

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar + screenshots + salvar
        env:
          BASE: https://vira-los.fly.dev
        run: |
          set -e
          ROTEIRO=$(cat <<'EOF'
          Use os textos abaixo EXATAMENTE como estao. Nao reescreva, nao resuma, nao acrescente frases.
          SLIDE 1 (capa, so o gancho): Você não precisa de mais paciente. Precisa de um programa que fidelize seu aluno.
          SLIDE 2 | Titulo: A dor | Texto: Vende hora, o paciente desmarca, e todo mês você começa do zero.
          SLIDE 3 | Titulo: O programa | Texto: Um acompanhamento com duração definida, entrega contínua e suporte de perto. O aluno vê resultado e renova.
          SLIDE 4 | Titulo: Fidelização = previsibilidade | Texto: Aluno que renova é faturamento que você já sabe que vem. Exemplo: 50 alunos num programa de R$ 400 por mês dá R$ 20 mil todo mês.
          SLIDE 5 | Titulo: Captação e vendas | Texto: Com processo comercial, entra aluno novo sem você depender só de indicação.
          SLIDE 6 | Titulo: Resultado | Texto: Mais faturamento, menos horas trabalhadas e mais tempo pra viver. Foi o que eu construí e você pode ter o mesmo.
          SLIDE 7 (CTA) | Texto: Eu monto esse programa junto com você. Comenta MENTORIA.
          EOF
          )
          INSTR="Carrossel FMTeam de MENTORIA para profissionais de saude (nutricionistas e personal trainers) que querem sair da venda de hora e montar um programa de acompanhamento. Use os textos do roteiro EXATAMENTE, slide a slide, sem reescrever. Fotos: profissional atendendo/escritorio/notebook, nada de substancia. Legenda curta na voz do Fabricio, tratamento voce, CTA comenta MENTORIA."
          TOPIC="Mentoria: programa que fideliza aluno em vez de vender hora"

          echo "=== disparando geração ==="
          body=$(jq -n --arg t "$TOPIC" --arg r "$ROTEIRO" --arg i "$INSTR" \
            '{topic:$t, roteiro:$r, instructions:$i, numSlides:7, layoutStyle:"fmteam", ctaStyle:"dark-fullbleed"}')
          resp=$(curl -sS -m 60 -X POST "$BASE/api/carousel/generate" -H "Content-Type: application/json" -d "$body")
          jobId=$(echo "$resp" | jq -r '.jobId // empty')
          if [ -z "$jobId" ]; then echo "❌ sem jobId: $resp"; exit 1; fi
          echo "jobId=$jobId"

          echo "=== aguardando geração ==="
          html=""; folder=""; legenda=""; nslides=7
          for i in $(seq 1 40); do
            sleep 15
            j=$(curl -sS -m 30 "$BASE/api/carousel/jobs/$jobId" || echo '{}')
            st=$(echo "$j" | jq -r '.status // "?"')
            echo "  tentativa $i — status=$st $(echo "$j" | jq -r '.step // ""')"
            if [ "$st" = "error" ]; then echo "❌ erro:"; echo "$j" | jq -r '.error'; exit 1; fi
            if [ "$st" = "done" ]; then
              folder=$(echo "$j" | jq -r '.result.folderName')
              nslides=$(echo "$j" | jq -r '.result.numSlides // 7')
              legenda=$(echo "$j" | jq -r '.result.legenda // ""')
              echo "$j" | jq -r '.result.html' > /tmp/carrossel.html
              echo "✅ gerado — folder=$folder ($nslides slides)"
              break
            fi
            if [ "$i" = "40" ]; then echo "⚠️ geração não concluiu"; exit 1; fi
          done

          echo "=== screenshots ==="
          ss=$(jq -Rs --arg f "$folder" '{html: ., folderName:$f}' < /tmp/carrossel.html | \
            curl -sS -m 120 -X POST "$BASE/api/carousel/screenshots-pp" -H "Content-Type: application/json" -d @- )
          shots=$(echo "$ss" | jq -c '.screenshots // []')
          echo "screenshots: $(echo "$shots" | jq 'length')"

          echo "=== salvar como rascunho ==="
          id="carousel_$(date +%s)_roteiro"
          save=$(jq -n --arg id "$id" --arg t "$TOPIC" --arg f "$folder" --argjson n "$nslides" \
            --argjson s "$shots" --arg l "$legenda" \
            '{id:$id, topic:$t, folderName:$f, numSlides:$n, screenshots:$s, legenda:$l}')
          r=$(echo "$save" | curl -sS -m 30 -X POST "$BASE/api/carousel/saved" -H "Content-Type: application/json" -d @- )
          echo "save: $r"
          echo ""
          echo "✅ PRONTO — abra na aba Carrossel (rascunhos) ou:"
          echo "   $BASE/output/$folder/carrossel.html"
          echo "----- legenda -----"
          echo "$legenda"
