name: John Hulk — biblioteca (refresh + smoke)

# Ferramenta MANUAL (ops + teste): atualiza a biblioteca de reels do John Hulk
# (Apify) e imprime um resumo. Opcionalmente modela o 1º reel 'novo' pra validar
# o pipeline de modelagem ponta a ponta (inclusive o MODO ANÚNCIO). Fora da rotina diária.
#
#   input model=false (default) → só refresh + lista (barato)
#   input model=true            → refresh + lista + modela 1 reel (usa API/créditos)
#   input mode=anuncio + cta=…  → modela em MODO ANÚNCIO (CTA direto por destino)

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Modelar o 1º reel 'novo' após o refresh? (true/false)"
        required: false
        default: "false"
      mode:
        description: "organico (default) ou anuncio"
        required: false
        default: "organico"
      cta:
        description: "destino do clique no modo anuncio: whatsapp | link | dm"
        required: false
        default: "whatsapp"

jobs:
  biblioteca:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh da biblioteca + smoke
        env:
          BASE: https://vira-los.fly.dev
          MODE: ${{ github.event.inputs.mode }}
          CTA: ${{ github.event.inputs.cta }}
        run: |
          set -e
          echo "=== disparando refresh da biblioteca ==="
          curl -sS -m 60 -X POST "$BASE/api/john-hulk/reels/refresh" \
            -H "Content-Type: application/json" -d '{}' || true
          echo ""

          echo "=== aguardando o refresh terminar ==="
          for i in $(seq 1 20); do
            sleep 15
            resp=$(curl -sS -m 30 "$BASE/api/john-hulk/reels?sort=views&order=desc" || echo '{}')
            refreshing=$(echo "$resp" | jq -r '.libraryState.refreshing // false')
            total=$(echo "$resp" | jq -r '.reels | length')
            echo "  tentativa $i — refreshing=$refreshing · reels na biblioteca=$total"
            if [ "$refreshing" = "false" ] && [ "$total" -gt 0 ]; then
              echo "✅ Biblioteca populada com $total reels."
              echo "----- top 5 por views -----"
              echo "$resp" | jq -r '.reels[:5][] | "views=\(.views) likes=\(.likes) comments=\(.comments) status=\(.status) \(.url)  \((.caption // "")[:60])"'
              break
            fi
            if [ "$i" = "20" ]; then echo "⚠️ refresh não concluiu no tempo esperado"; fi
          done

          if [ "${{ github.event.inputs.model }}" != "true" ]; then
            echo "model=false — encerrando (só refresh)."; exit 0
          fi

          echo "=== modelando o 1º reel 'novo' (mode=$MODE) ==="
          resp=$(curl -sS -m 30 "$BASE/api/john-hulk/reels?status=novo&sort=views&order=desc" || echo '{}')
          sc=$(echo "$resp" | jq -r '.reels[0].shortCode // empty')
          if [ -z "$sc" ]; then echo "nenhum reel 'novo' pra modelar."; exit 0; fi
          echo "reel escolhido: $sc"

          if [ "$MODE" = "anuncio" ]; then
            body=$(jq -n --arg cta "$CTA" '{mode:"anuncio", ctaDestination:$cta, offer:"avaliacao gratuita", numSlides:6}')
          else
            body='{}'
          fi
          echo "body: $body"
          curl -sS -m 60 -X POST "$BASE/api/john-hulk/reels/$sc/model" \
            -H "Content-Type: application/json" -d "$body" || true
          echo ""

          echo "=== aguardando a modelagem ==="
          for i in $(seq 1 30); do
            sleep 20
            r=$(curl -sS -m 30 "$BASE/api/john-hulk/reels?q=" || echo '{}')
            st=$(echo "$r" | jq -r --arg sc "$sc" '.reels[] | select(.shortCode==$sc) | .status')
            cid=$(echo "$r" | jq -r --arg sc "$sc" '.reels[] | select(.shortCode==$sc) | .carouselId // "-"')
            echo "  tentativa $i — status=$st carouselId=$cid"
            if [ "$st" = "erro" ]; then
              echo "❌ Modelagem falhou (status=erro):"
              echo "$r" | jq -r --arg sc "$sc" '.reels[] | select(.shortCode==$sc) | .errorMessage'
              exit 1
            fi
            if [ "$st" != "novo" ] && [ "$cid" != "-" ]; then
              echo "✅ Reel $sc modelado — carrossel $cid"
              echo "$r" | jq -r --arg sc "$sc" '.reels[] | select(.shortCode==$sc) | "tema=\(.topic) status=\(.status)"'
              echo "----- carrossel gerado (mode/cta/offer) -----"
              saved=$(curl -sS -m 30 "$BASE/api/carousel/saved" || echo '[]')
              echo "$saved" | jq -r --arg id "$cid" '.[] | select(.id==$id) | "mode=\(.mode // "-") ctaDestination=\(.ctaDestination // "-") offer=\(.offer // "-") numSlides=\(.numSlides)"'
              echo "----- legenda gerada (deve estar SEM rotulos [LEGENDA]/[HASHTAGS]) -----"
              echo "$saved" | jq -r --arg id "$cid" '.[] | select(.id==$id) | .legenda'
              exit 0
            fi
          done
          echo "⚠️ modelagem não concluiu no tempo esperado (pode ainda estar rodando)."
