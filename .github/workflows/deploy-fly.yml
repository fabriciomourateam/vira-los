name: Deploy Backend to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # permite redeploy manual pelo botão do GitHub

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # --no-cache é OBRIGATÓRIO: sem ele o build remoto do Fly reaproveita a
      # camada "COPY server/ ." do cache e publica imagens SEM as mudanças de
      # código (deploy dá "success" mas o app roda código velho).
      #
      # NÃO usar `--strategy immediate`: em 2026-08-10 ele derrubou a única
      # máquina pra recriar e a nova não subiu (host do volume sem capacidade),
      # deixando o app com ZERO máquina e fora do ar. Sem essa flag, o flyctl
      # ATUALIZA a máquina existente no lugar (não destrói antes de criar), então
      # um deploy nunca mais deixa o app sem máquina.
      - run: flyctl deploy --remote-only --no-cache
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
