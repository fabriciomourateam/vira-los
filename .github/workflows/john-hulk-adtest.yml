name: John Hulk — teste de anúncio (best ad e2e)

# Manual: atualiza os anúncios da Biblioteca de Anúncios do anunciante, escolhe o
# MELHOR (mais tempo no ar = campeão comprovado) e modela em carrossel FMTeam.
# Imprime a copy do anúncio de origem + o carrossel gerado (folder/tema/legenda),
# pra revisar/publicar um teste. Fora da rotina diária.
#
#   input mode=organico (default) ou anuncio ; cta=whatsapp|link|dm (só no modo anuncio)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "organico (default) ou anuncio"
        required: false
        default: "organico"
      cta:
        description: "destino do clique no modo anuncio: whatsapp | link | dm"
        required: false
        default: "whatsapp"
      faithful:
        description: "modo fiel (carrossel fiel ao assunto do anúncio): true | false"
        required: false
        default: "true"
      regenerate:
        description: "remodelar o MELHOR anúncio mesmo já modelado (ignora filtro status=novo): true | false"
        required: false
        default: "true"

jobs:
  adtest:
    runs-on: ubuntu-latest
    steps:
      - name: Atualizar anúncios + modelar o melhor
        env:
          BASE: https://vira-los.fly.dev
          MODE: ${{ github.event.inputs.mode }}
          CTA: ${{ github.event.inputs.cta }}
          FAITHFUL: ${{ github.event.inputs.faithful }}
          REGEN: ${{ github.event.inputs.regenerate }}
        run: |
          set -e
          echo "=== atualizando a Biblioteca de Anúncios ==="
          curl -sS -m 60 -X POST "$BASE/api/john-hulk/ads/refresh" \
            -H "Content-Type: application/json" -d '{}' || true
          echo ""

          echo "=== aguardando o refresh dos anúncios ==="
          for i in $(seq 1 20); do
            sleep 15
            resp=$(curl -sS -m 30 "$BASE/api/john-hulk/reels?sourceType=ad&sort=running&order=desc" || echo '{}')
            refreshing=$(echo "$resp" | jq -r '.adLibraryState.refreshing // false')
            total=$(echo "$resp" | jq -r '[.reels[]? | select(.sourceType=="ad")] | length')
            echo "  tentativa $i — refreshing=$refreshing · anúncios=$total"
            if [ "$refreshing" = "false" ] && [ "$total" -gt 0 ]; then
              echo "✅ $total anúncios na biblioteca. Top 5 por tempo no ar:"
              echo "$resp" | jq -r '[.reels[]? | select(.sourceType=="ad")][:5][] | "runningDays=\(.runningDays) ativo=\(.adActive) formato=\(.displayFormat) \(.url)  copy=\((.adCopy // "")[:70])"'
              break
            fi
            if [ "$i" = "20" ]; then echo "⚠️ refresh de anúncios não concluiu"; exit 1; fi
          done

          if [ "$REGEN" = "true" ]; then
            echo "=== escolhendo o MELHOR anúncio (mais tempo no ar; regenerate=true, ignora status) ==="
            resp=$(curl -sS -m 30 "$BASE/api/john-hulk/reels?sourceType=ad&sort=running&order=desc" || echo '{}')
          else
            echo "=== escolhendo o MELHOR anúncio (mais tempo no ar, ainda não usado) ==="
            resp=$(curl -sS -m 30 "$BASE/api/john-hulk/reels?sourceType=ad&status=novo&sort=running&order=desc" || echo '{}')
          fi
          sc=$(echo "$resp" | jq -r '[.reels[]? | select(.sourceType=="ad")][0].shortCode // empty')
          if [ -z "$sc" ]; then echo "nenhum anúncio pra modelar."; exit 0; fi
          echo "anúncio escolhido: $sc"
          echo "----- copy do anúncio de origem -----"
          echo "$resp" | jq -r --arg sc "$sc" '[.reels[]? | select(.shortCode==$sc)][0] | "runningDays=\(.runningDays) status=\(.status) formato=\(.displayFormat)\ncopy:\n\(.adCopy // "-")"'

          if [ "$FAITHFUL" = "true" ]; then FAITHFUL_JSON=true; else FAITHFUL_JSON=false; fi
          if [ "$REGEN" = "true" ]; then REGEN_JSON=true; else REGEN_JSON=false; fi
          if [ "$MODE" = "anuncio" ]; then
            body=$(jq -n --arg cta "$CTA" --argjson f "$FAITHFUL_JSON" --argjson r "$REGEN_JSON" '{mode:"anuncio", ctaDestination:$cta, numSlides:6, faithful:$f, regenerate:$r}')
          else
            body=$(jq -n --argjson f "$FAITHFUL_JSON" --argjson r "$REGEN_JSON" '{faithful:$f, regenerate:$r}')
          fi
          # carouselId ANTES de modelar — no regenerate de um anúncio já modelado, o
          # status continua 'modelado' e o carouselId só muda quando a NOVA geração
          # termina; esperamos o cid MUDAR pra não ler o carrossel antigo (drifted).
          prev_cid=$(echo "$resp" | jq -r --arg sc "$sc" '[.reels[]? | select(.shortCode==$sc)][0].carouselId // "-"')
          echo "carouselId anterior: $prev_cid"
          echo "body: $body"
          curl -sS -m 60 -X POST "$BASE/api/john-hulk/reels/$sc/model" \
            -H "Content-Type: application/json" -d "$body" || true
          echo ""

          echo "=== aguardando a modelagem ==="
          for i in $(seq 1 30); do
            sleep 20
            r=$(curl -sS -m 30 "$BASE/api/john-hulk/reels?sourceType=ad" || echo '{}')
            st=$(echo "$r" | jq -r --arg sc "$sc" '[.reels[]? | select(.shortCode==$sc)][0].status')
            cid=$(echo "$r" | jq -r --arg sc "$sc" '[.reels[]? | select(.shortCode==$sc)][0].carouselId // "-"')
            echo "  tentativa $i — status=$st carouselId=$cid"
            if [ "$st" = "erro" ]; then
              echo "❌ Modelagem falhou:"; echo "$r" | jq -r --arg sc "$sc" '[.reels[]? | select(.shortCode==$sc)][0].errorMessage'; exit 1
            fi
            if [ "$st" != "novo" ] && [ "$cid" != "-" ] && [ "$cid" != "$prev_cid" ]; then
              echo "✅ Anúncio $sc modelado — carrossel $cid"
              saved=$(curl -sS -m 30 "$BASE/api/carousel/saved" || echo '[]')
              echo "----- carrossel gerado -----"
              echo "$saved" | jq -r --arg id "$cid" '.[] | select(.id==$id) | "tema=\(.topic)\nderivedTopic=\(.derivedTopic // "-")\nmodoFiel=\(.faithful // false)\nsourceType=\(.mode // "-")/\(.sourceType // "-")\nnumSlides=\(.numSlides) folder=\(.folderName)\nabrir: '"$BASE"'/output/\(.folderName)/carrossel.html"'
              echo "----- legenda (pronta pra postar) -----"
              echo "$saved" | jq -r --arg id "$cid" '.[] | select(.id==$id) | .legenda'
              exit 0
            fi
          done
          echo "⚠️ modelagem não concluiu no tempo esperado."
