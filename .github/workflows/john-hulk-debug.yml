name: John Hulk — debug (model + fly logs)

# Manual: dispara a modelagem de 1 reel (shortCode informado) e captura os logs
# do servidor (flyctl) com o STACK real — pra diagnosticar por que modelReel falha.

on:
  workflow_dispatch:
    inputs:
      shortCode:
        description: "shortCode do reel 'novo' pra modelar"
        required: true

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Model + capturar logs
        env:
          BASE: https://vira-los.fly.dev
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SC: ${{ github.event.inputs.shortCode }}
        run: |
          echo "=== disparando modelReel($SC) ==="
          curl -sS -m 40 -X POST "$BASE/api/john-hulk/reels/$SC/model" \
            -H "Content-Type: application/json" -d '{"regenerate":true}' || true
          echo ""
          echo "=== capturando logs da app por ~200s (procure [JohnHulk]) ==="
          timeout 200 flyctl logs -a vira-los || true
          echo "----- fim -----"
