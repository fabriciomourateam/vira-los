name: Top posts do Instagram (manual)

# So leitura. Puxa /api/instagram/posts do servidor e imprime os posts que mais
# deram resultado, com o mesmo peso do auto-ajuste de temas:
# comentario x6, seguidor x5, salvamento x4, compartilhamento x3, curtida x1.

on:
  workflow_dispatch: {}

jobs:
  top:
    runs-on: ubuntu-latest
    steps:
      - name: Ranking
        env:
          BASE: https://vira-los.fly.dev
        run: |
          set +e
          for i in 1 2 3 4; do
            code=$(curl -sS -m 40 -o /tmp/p.json -w '%{http_code}' "$BASE/api/instagram/posts")
            echo "tentativa $i: HTTP $code"; [ "$code" = "200" ] && break; sleep 8
          done
          echo "total de posts: $(jq 'length' /tmp/p.json)"
          jq -r '
            map(. + {score: ((.comments//0)*6 + (.follows//0)*5 + (.saves//0)*4 + (.shares//0)*3 + (.likes//0))})
            | sort_by(-.score) | .[:30][]
            | "\(.score|floor) | \(.media_type // .type // "?") | \((.timestamp // .date // "")[:10]) | c\(.comments//0) s\(.saves//0) sh\(.shares//0) l\(.likes//0) r\(.reach//0) | \((.caption//"")|gsub("\n";" ")|.[:110])"
          ' /tmp/p.json
