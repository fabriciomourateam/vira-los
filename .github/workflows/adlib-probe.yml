name: Ad Library — sonda (validar actor Apify)

# Manual/temporário: chama POST /api/john-hulk/ads/probe com um actor + input do
# Apify pra descobrir qual actor da Biblioteca de Anúncios devolve os anúncios do
# anunciante e qual o shape dos dados. Iterável sem redeploy.

on:
  workflow_dispatch:
    inputs:
      actor:
        description: "actor do Apify (ex.: curious_coder/facebook-ads-library-scraper)"
        required: true
      input_json:
        description: "input do actor em JSON (uma linha)"
        required: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar a sonda
        env:
          BASE: https://vira-los.fly.dev
          ACTOR: ${{ github.event.inputs.actor }}
          INPUT_JSON: ${{ github.event.inputs.input_json }}
        run: |
          set -e
          body=$(jq -n --arg a "$ACTOR" --argjson inp "$INPUT_JSON" '{actor:$a, input:$inp}')
          echo "=== chamando /ads/probe (actor=$ACTOR) ==="
          resp=$(curl -sS -m 180 -X POST "$BASE/api/john-hulk/ads/probe" \
            -H "Content-Type: application/json" -d "$body" || echo '{}')
          echo "$resp" | jq -r 'if .ok then "OK count=\(.count)\nkeys=\(.firstKeys|join(", "))\nsample=\(.sample)" else "ERRO: \(.error)" end'
