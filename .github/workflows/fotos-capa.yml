name: Fotos pra capa (manual)

# Busca fotos no Pexels pelo servidor (que tem a chave), baixa as opcoes e salva
# no branch assets-capas (NAO mexe na main, nao dispara deploy).

on:
  workflow_dispatch:
    inputs:
      queries:
        description: 'Buscas separadas por | (ex: man beer bar|tired man bed)'
        required: true
      per:
        description: 'Fotos por busca'
        default: '4'

permissions:
  contents: write

jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar e baixar
        env:
          BASE: https://vira-los.fly.dev
          Q: ${{ inputs.queries }}
          PER: ${{ inputs.per }}
        run: |
          set +e
          git fetch origin assets-capas && git checkout assets-capas || git checkout --orphan assets-capas
          git rm -rq . 2>/dev/null; mkdir -p capas
          IFS='|' read -ra QS <<< "$Q"
          for q in "${QS[@]}"; do
            slug=$(echo "$q" | tr ' ' '-' | tr -cd 'a-zA-Z0-9-')
            curl -sS -m 40 -G "$BASE/api/pexels" --data-urlencode "query=$q" --data-urlencode "per_page=$PER" -o /tmp/r.json
            n=0
            for u in $(jq -r '.photos[]?.url' /tmp/r.json); do
              n=$((n+1)); curl -sSL -m 60 "$u" -o "capas/${slug}_${n}.jpg"
            done
            jq -r --arg s "$slug" '.photos[]? | "\($s) | \(.id) | \(.photographer) | \(.alt)"' /tmp/r.json >> capas/creditos.txt
            echo "$q -> $n fotos"
          done
          git config user.name "vira-los-bot"; git config user.email "bot@users.noreply.github.com"
          git add capas && git commit -qm "fotos de capa: $Q" && git push -f origin HEAD:assets-capas
